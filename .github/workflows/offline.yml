name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/router-agent-tiktoken
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Cache tokenizer data while network access is available
        run: uv run python -c 'import tiktoken; tiktoken.get_encoding("o200k_base")'
      - name: Run synthetic tests without LAN or Internet access
        run: |
          sudo unshare --net bash -c 'ip link set lo up; exec runuser -u "$1" -- env TIKTOKEN_CACHE_DIR="$2" .venv/bin/python -m pytest -q' -- "$USER" "$TIKTOKEN_CACHE_DIR"
      - name: Build distributions
        run: uv build
      - name: Inspect wheel metadata and packaged JSON
        run: python scripts/check_wheel.py
