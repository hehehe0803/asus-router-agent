[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asus-router-agent"
version = "0.2.0"
description = "Bounded native ASUS router reads and guarded native operations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/asusrouter/LICENSE", "third_party/asusrouter/NOTICE"]
requires-python = ">=3.11"
dependencies = ["asusrouter==1.21.3", "aiohttp==3.14.5", "keyring>=25,<26"]

[project.scripts]
router-agent = "router_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "tiktoken>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/router_agent"]
